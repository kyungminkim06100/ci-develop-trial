# develop에 머지되면 망 시험을 돌리고, 통과한 커밋을 main으로 fast-forward 한다.
# 실행은 한 번에 하나만 돈다. 도는 동안 머지가 여러 번 들어오면 기다리는 실행은 가장 최근 것 하나만 남고
# (GitHub concurrency가 앞서 기다리던 것을 취소한다), 그 실행이 쌓인 머지를 한 번에 시험한다.
name: develop
on:
  push:
    branches: [develop]

concurrency:
  group: develop-network
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/unit -v

  # main 규칙이 이 이름의 체크를 요구한다. 이름을 바꾸면 규칙도 바꿀 것.
  network:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: tests/network/run.sh
        env:
          NETWORK_SLEEP: ${{ vars.NETWORK_SLEEP || '60' }}

  promote:
    needs: network
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fast-forward main to the tested commit
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "main already contains $GITHUB_SHA"; exit 0
          fi
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "::error::main($(git rev-parse --short origin/main)) is not an ancestor of $GITHUB_SHA — someone changed main outside develop"
            exit 1
          fi
          # fast-forward만 한다. --force가 없으니 앞지르기가 아니면 push가 거절된다.
          git push origin "$GITHUB_SHA:refs/heads/main"
          echo "main -> $(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_STEP_SUMMARY"
